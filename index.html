<link rel="manifest" href="data:application/json,{%22name%22:%22Our%20Farm%20Story%22,%22short_name%22:%22Farm%22,%22display%22:%22standalone%22,%22start_url%22:%22.%22,%22background_color%22:%22%23F2EFE3%22,%22theme_color%22:%223A2E22%22}">
<style>
/* ============================================================
   CONFIG — edit the values in the <script> block near the
   bottom of this file, not here.

:root{
  --bark: #3A2E22;         /* header, deep trunk brown */
  --canopy: #3F5C3E;       /* primary buttons, deep forest green */
  --canopy-dark: #2E452F;
  --leaf: #A98F4F;         /* timeline marker, warm dried-leaf gold */
  --leaf-light: #E3D9B6;   /* header subtitle, highlight backgrounds */
  --creek: #4F7472;        /* date labels, cool water accent */
  --parchment: #F2EFE3;    /* page background, birch-paper tone */
  --parchment-dark: #E6E0CB;
  --ink: #2A2620;
  --ink-soft: #5A5344;
  --line: #D6CFB4;
  --good: #4C6B4C;

}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--parchment);
  color: var(--ink);
  font-family: 'Iowan Old Style','Palatino Linotype', Georgia, serif;
  -webkit-font-smoothing: antialiased;
  min-height:100vh;
}
h1,h2,h3,.display{
  font-family: 'Iowan Old Style', Georgia, 'Times New Roman', serif;

}
button, input, textarea{
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
button{ cursor:pointer; }

.wrap{ max-width: 640px; margin: 0 auto; padding: 0 18px 120px; }

/* ---------- Header ---------- */
header.top{
  background: var(--bark);
  color: var(--parchment);
  padding: 22px 18px 26px;
  border-bottom: 6px solid var(--leaf);
}
header.top .inner{ max-width:640px; margin:0 auto; display:flex; align-items:flex-end; justify-content:space-between; gap:12px;}
header.top h1{ margin:0; font-size: 1.7rem; color:#fff; }

/* ---------- Sign in screen ---------- */

/* ---------- Timeline ---------- */

.entry .byline{ font-family:-apple-system,sans-serif; font-size:0.78rem; color: var(--ink-soft); margin-bottom:10px;}
.entry .media{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 10px;}

/* ---------- Floating add button ---------- */

}

textarea.capture-input{

.voice-status{ font-family:-apple-system,sans-serif; color:var(--ink-soft); font-size:0.85rem; margin-top:12px; }
.voice-transcript{ text-align:left; margin-top:14px; font-size:1.05rem; }

.file-drop{
  border:2px dashed var(--line); border-radius:12px; padding: 26px 14px; text-align:center;

}
.file-drop input{ display:none; }
.file-preview{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.file-preview .chip{
  display:flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--line);
  border-radius:8px; padding:6px 10px; font-family:-apple-system,sans-serif; font-size:0.8rem;
}
.file-preview img{ width:36px; height:36px; object-fit:cover; border-radius:4px; }
.file-preview .rm{ background:none;border:none;color:var(--danger);font-weight:bold; padding:0 2px; }

.helper-note{ font-family:-apple-system,sans-serif; font-size:0.8rem; color: var(--ink-soft); margin-top:6px;}

.field{ margin-bottom:14px; }
.field label{ display:block; font-family:-apple-system,sans-serif; font-size:0.78rem; font-weight:600; color: var(--ink-soft); margin-bottom:5px; text-transform:none;}
.field input, .field textarea{
  width:100%; border:1px solid var(--line); border-radius:8px; padding:11px 12px;
  font-size:1rem; font-family: 'Iowan Old Style', Georgia, serif; background:#fff;
}
.field textarea{ min-height:90px; resize:vertical; }

.btn-row{ display:flex; gap:10px; margin-top:8px; }
.btn-row .btn-primary{ flex:1; }
.btn-secondary{
  background:#fff; color: var(--ink); border:1px solid var(--line); border-radius:10px;
  padding: 16px 20px; font-family:-apple-system,sans-serif; font-weight:600;
}
.btn-block{ width:100%; }

.loader{
  text-align:center; padding: 30px 10px; font-family:-apple-system,sans-serif; color: var(--ink-soft);
}
.spinner{
  width:34px; height:34px; border:3px solid var(--line); border-top-color: var(--canopy);
  border-radius:50%; margin: 0 auto 14px; animation: spin 0.8s linear infinite;
}
@keyframes spin{ to{ transform: rotate(360deg); } }

.error-box{
  background:#fbe9e5; border:1px solid var(--danger); color: var(--danger);
  border-radius:8px; padding:12px 14px; font-family:-apple-system,sans-serif; font-size:0.85rem; margin-bottom:14px;
}
.setup-note{
  background: var(--leaf-light); border:1px solid var(--leaf); border-radius:10px;
  padding:14px 16px; font-family:-apple-system,sans-serif; font-size:0.82rem; color: var(--ink); margin: 16px 0;
  line-height:1.5;
}
</style>

<body>

<header class="top">
  <div class="inner">
    <div>
      <h1 id="farmTitle">Our Farm Story</h1>
      <p>A running record of the woods</p>
    </div>
    <div class="auth-pill" id="authPill" style="display:none;"></div>
  </div>
</header>

<div class="wrap" id="app">
  <!-- filled by JS -->
</div>

<button class="fab" id="fabAdd" style="display:none;">+ Add a memory</button>

<div id="modalRoot"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* ============================================================
   1. CONFIG — fill these in, then re-upload/deploy the file.

   Note on ANTHROPIC_API_KEY: it ships inside this file's source,
   so anyone who can view the deployed page's source (or the
   network tab) can read it. That's an accepted tradeoff for a
   small, sign-in-gated family app — do not reuse this key
   anywhere it would matter more, and regenerate it if the link
   is ever shared beyond the family.
   ============================================================ */
const CONFIG = {
  FARM_NAME: "Our Farm Story",              // shows in the header
  GOOGLE_CLIENT_ID: "PASTE_YOUR_GOOGLE_OAUTH_CLIENT_ID_HERE",
  DRIVE_FOLDER_ID: "PASTE_YOUR_SHARED_DRIVE_FOLDER_ID_HERE",
  ANTHROPIC_API_KEY: "PASTE_YOUR_ANTHROPIC_API_KEY_HERE",
  ANTHROPIC_MODEL: "claude-sonnet-5"
};

/* ============================================================
   2. STATE
   ============================================================ */
const state = {
  accessToken: null,
  tokenClient: null,
  dataFileId: null,
  entries: [],
  authorName: localStorage.getItem('farmapp_author') || '',
  pendingFiles: [],   // [{file, previewUrl}]
  editingId: null,
  _tokenResolve: null,
  _tokenReject: null,
  _previewUrls: [],
};

document.getElementById('farmTitle').textContent = CONFIG.FARM_NAME;

/* ============================================================
   3. GOOGLE SIGN-IN
   ============================================================ */
function initGoogle(){
  if (!window.google || !window.google.accounts){
    setTimeout(initGoogle, 300);
    return;
  }
  state.tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.GOOGLE_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/drive',
    callback: async (resp) => {
      if (resp.error){
        // A silent refresh (see requestFreshToken) is waiting on this —
        // reject it instead of showing the normal sign-in error.
        if (state._tokenReject){
          const reject = state._tokenReject;
          state._tokenResolve = null; state._tokenReject = null;
          reject(new Error(resp.error));
          return;
        }
        renderError("Sign-in didn't go through. Please try again.");
        return;
      }
      state.accessToken = resp.access_token;
      // A silent refresh is waiting on this token — hand it back without
      // running the full sign-in flow (no name prompt, no timeline reload).
      if (state._tokenResolve){
        const resolve = state._tokenResolve;
        state._tokenResolve = null; state._tokenReject = null;
        resolve(resp.access_token);
        return;
      }
      await afterSignIn();
    },
  });
  renderSignedOut();
}

// Google's access tokens expire after about an hour. This asks for a new
// one in the background (no popup when the user already granted access)
// so a long session doesn't just start failing with 401s.
function requestFreshToken(promptVal){
  return new Promise((resolve, reject) => {
    state._tokenResolve = resolve;
    state._tokenReject = reject;
    state.tokenClient.requestAccessToken({ prompt: promptVal });
  });
}

function signIn(){
  if (!CONFIG.GOOGLE_CLIENT_ID || CONFIG.GOOGLE_CLIENT_ID.startsWith('PASTE')){
    renderError("This app isn't set up yet — the Google Client ID is still a placeholder. See the setup note below.");
    return;
  }
  state.tokenClient.requestAccessToken({ prompt: '' });
}

async function afterSignIn(){
  if (!state.authorName){
    const name = prompt("What's your name? (shown next to what you add)");
    state.authorName = (name || 'Someone').trim();
    localStorage.setItem('farmapp_author', state.authorName);
  }
  renderAuthPill();
  document.getElementById('fabAdd').style.display = 'flex';
  await loadTimeline();
}

function renderAuthPill(){
  const pill = document.getElementById('authPill');
  pill.style.display = 'block';
  pill.innerHTML = `${escapeHtml(state.authorName)} &middot; <button onclick="signOut()">switch</button>`;
}
function signOut(){
  state.accessToken = null;
  state.dataFileId = null;
  state.entries = [];
  document.getElementById('fabAdd').style.display = 'none';
  const pill = document.getElementById('authPill');
  pill.style.display = 'none';
  pill.innerHTML = '';
  renderSignedOut();
}

/* ============================================================
   4. GOOGLE DRIVE HELPERS
   All calls go straight to the Drive REST API with the OAuth
   access token — no extra library needed.
   ============================================================ */
const DRIVE_API = 'https://www.googleapis.com/drive/v3';
const DRIVE_UPLOAD = 'https://www.googleapis.com/upload/drive/v3';

async function driveFetch(url, opts={}, isRetry){
  const headers = Object.assign({}, opts.headers, { Authorization: `Bearer ${state.accessToken}` });
  const res = await fetch(url, Object.assign({}, opts, { headers }));
  if (res.status === 401 && !isRetry && state.tokenClient){
    // Token likely expired — get a fresh one silently and retry once.
    try{
      await requestFreshToken('');
      return driveFetch(url, opts, true);
    }catch(e){
      throw new Error('Your session expired — please sign in again.');
    }
  }
  if (!res.ok){
    const text = await res.text().catch(()=> '');
    throw new Error(`Drive request failed (${res.status}): ${text.slice(0,200)}`);
  }
  return res;
}

async function findOrCreateDataFile(){
  const q = encodeURIComponent(`'${CONFIG.DRIVE_FOLDER_ID}' in parents and name = 'farm-timeline-data.json' and trashed = false`);
  const res = await driveFetch(`${DRIVE_API}/files?q=${q}&fields=files(id,name)`);
  const json = await res.json();
  if (json.files && json.files.length){
    return json.files[0].id;
  }
  // create it
  const metadata = { name: 'farm-timeline-data.json', parents: [CONFIG.DRIVE_FOLDER_ID], mimeType: 'application/json' };
  const boundary = '-------farmapp' + Date.now();
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n[]\r\n` +
    `--${boundary}--`;
  const res2 = await driveFetch(`${DRIVE_UPLOAD}/files?uploadType=multipart&fields=id`, {
    method: 'POST',
    headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
    body
  });
  const created = await res2.json();
  return created.id;
}

async function readDataFile(fileId){
  const res = await driveFetch(`${DRIVE_API}/files/${fileId}?alt=media`);
  try { return await res.json(); } catch(e){ return []; }
}

async function writeDataFile(fileId, entries){
  await driveFetch(`${DRIVE_UPLOAD}/files/${fileId}?uploadType=media`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(entries)
  });
}

async function uploadFileToDrive(file){
  const metadata = { name: file.name, parents: [CONFIG.DRIVE_FOLDER_ID] };
  const boundary = '-------farmapp' + Date.now() + Math.random();
  const base64Data = await blobToBase64(file);
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: ${file.type || 'application/octet-stream'}\r\nContent-Transfer-Encoding: base64\r\n\r\n${base64Data}\r\n` +
    `--${boundary}--`;
  const res = await driveFetch(`${DRIVE_UPLOAD}/files?uploadType=multipart&fields=id,name,webViewLink,thumbnailLink,mimeType`, {
    method: 'POST',
    headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
    body
  });
  const created = await res.json();
  // make it viewable by anyone with the link (same-org / family members already have folder access;
  // this just avoids per-file permission headaches)
  try{
    await driveFetch(`${DRIVE_API}/files/${created.id}/permissions`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ role:'reader', type:'anyone' })
    });
  }catch(e){ /* non-fatal */ }
  return created;
}

function blobToBase64(blob){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

/* ============================================================
   5. TIMELINE LOAD / SAVE
   ============================================================ */
async function loadTimeline(){
  renderLoading("Fetching the story so far…");
  try{
    if (!state.dataFileId){
      state.dataFileId = await findOrCreateDataFile();
    }
    state.entries = await readDataFile(state.dataFileId);
    renderTimeline();
  }catch(e){
    renderError("Couldn't load the timeline from Drive: " + e.message);
  }
}

async function saveEntries(){
  await writeDataFile(state.dataFileId, state.entries);
}

/* ============================================================
   6. CLAUDE CLEANUP
   ============================================================ */
async function cleanupWithClaude(rawText){
  const prompt = `You are helping turn a rough, spoken or typed note about a family farm's history into a clean timeline entry. The note may be messy, a fragment, or just a description of a photo.

Raw note: """${rawText}"""

Reply with ONLY a JSON object, no markdown fences, no commentary, in this exact shape:
{"title": "short warm title, under 8 words", "dateLabel": "a human date guess like '1986' or 'Summer 1990s' or 'Undated', based only on what's in the note", "sortYear": <a 4-digit integer year if you can reasonably guess one, otherwise null>, "summary": "2-4 friendly sentences in plain language, cleaned up but keeping all the real facts from the note, written as if for a family history"}`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': CONFIG.ANTHROPIC_API_KEY,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: CONFIG.ANTHROPIC_MODEL,
      max_tokens: 500,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if (!res.ok){
    const t = await res.text().catch(()=>'');
    throw new Error(`Claude request failed (${res.status}): ${t.slice(0,200)}`);
  }
  const data = await res.json();
  const text = (data.content || []).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
  const cleaned = text.replace(/^```json|```$/g, '').trim();
  try{
    return JSON.parse(cleaned);
  }catch(e){
    return { title: 'A farm memory', dateLabel: 'Undated', sortYear: null, summary: rawText };
  }
}

/* ============================================================
   7. RENDERING
   ============================================================ */
const app = document.getElementById('app');

function renderSignedOut(){
  app.innerHTML = `
    <div class="signin-card">
      <div class="icon">🌲</div>
      <h2>${escapeHtml(CONFIG.FARM_NAME)}</h2>
      <p>Sign in with Google to see the timeline and add new memories. Everything gets saved to the family Drive folder automatically.</p>
      <button class="btn-primary" onclick="signIn()">Sign in with Google</button>
      <div class="setup-note" id="setupNote" style="display:none;"></div>
    </div>
  `;
  maybeShowSetupNote();
}

function maybeShowSetupNote(){
  const missing = [];
  if (CONFIG.GOOGLE_CLIENT_ID.startsWith('PASTE')) missing.push('Google Client ID');
  if (CONFIG.DRIVE_FOLDER_ID.startsWith('PASTE')) missing.push('Drive Folder ID');
  if (CONFIG.ANTHROPIC_API_KEY.startsWith('PASTE')) missing.push('Anthropic API key');
  if (missing.length){
    const note = document.getElementById('setupNote');
    if (note){
      note.style.display = 'block';
      note.innerHTML = `<strong>Not set up yet.</strong> Missing: ${missing.join(', ')}. Open this file's CONFIG section and fill these in, then redeploy.`;
    }
  }
}

function renderLoading(msg){
  app.innerHTML = `<div class="loader"><div class="spinner"></div>${escapeHtml(msg)}</div>`;
}

function renderError(msg){
  const existing = app.querySelector('.error-box');
  const box = document.createElement('div');
  box.className = 'error-box';
  box.textContent = msg;
  if (existing) existing.remove();
  app.prepend(box);
}

function renderTimeline(){
  if (!state.entries.length){
    app.innerHTML = `
      <div class="empty-state">
        <div class="icon">🦋</div>
        <p>No memories yet. Tap "Add a memory" below to start the story —<br>an old photo, a timber sale receipt, or just what you saw today.</p>
      </div>`;
    return;
  }
  const sorted = [...state.entries].sort((a,b)=>{
    const ay = a.sortYear ?? 99999, by = b.sortYear ?? 99999;
    if (ay !== by) return by - ay;
    return (b.createdAt||0) - (a.createdAt||0);
  });
  app.innerHTML = `<div class="timeline">${sorted.map(entryHtml).join('')}</div>`;
}

function entryHtml(e){
  const media = (e.files||[]).map(f=>{
    if (f.mimeType && f.mimeType.startsWith('image/') && f.thumbnailLink){
      return `<a href="${escapeHtml(f.webViewLink)}" target="_blank"><img src="${escapeHtml(f.thumbnailLink)}" alt=""></a>`;
    }
    return `<a class="filechip" href="${escapeHtml(f.webViewLink)}" target="_blank">📄 ${escapeHtml(f.name)}</a>`;
  }).join('');
  return `
    <div class="entry" data-id="${e.id}">
      <div class="date">${escapeHtml(e.dateLabel || 'Undated')}</div>
      <h3>${escapeHtml(e.title)}</h3>
      <p class="summary">${escapeHtml(e.summary)}</p>
      ${media ? `<div class="media">${media}</div>` : ''}
      <div class="byline">Added by ${escapeHtml(e.author || 'someone')}</div>
      <div class="actions">
        <button onclick="openEdit('${e.id}')">Edit</button>
        <button class="danger" onclick="deleteEntry('${e.id}')">Remove</button>
      </div>
    </div>`;
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   8. CAPTURE FLOW (modal)
   ============================================================ */
const modalRoot = document.getElementById('modalRoot');
document.getElementById('fabAdd').addEventListener('click', openCapture);

let recognizer = null;

function openCapture(){
  state.pendingFiles = [];
  state._previewUrls = [];
  modalRoot.innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="sheet">
        <button class="close-x" onclick="closeModal()">✕</button>
        <div class="sheet-handle"></div>
        <h2>Add a memory</h2>
        <p class="sub">Speak it, type it, or drop in a photo — whatever's easiest.</p>

        <div class="mode-row">
          <button class="mode-btn active" id="modeVoiceBtn" onclick="switchMode('voice')"><span class="glyph">🎤</span>Speak</button>
          <button class="mode-btn" id="modeTypeBtn" onclick="switchMode('type')"><span class="glyph">✏️</span>Type</button>
          <button class="mode-btn" id="modeFileBtn" onclick="switchMode('file')"><span class="glyph">📷</span>Photo / File</button>
        </div>

        <div id="modeBody"></div>

        <div class="field" style="margin-top:16px;">
          <label>Attach a photo or file (optional, any mode)</label>
          <div class="file-drop" onclick="document.getElementById('fileInput').click()">
            Tap to choose a photo or file
            <input type="file" id="fileInput" multiple accept="image/*,application/pdf,.doc,.docx" onchange="handleFiles(this.files)">
          </div>
          <div class="file-preview" id="filePreview"></div>
        </div>

        <button class="btn-primary btn-block" style="margin-top:18px;" onclick="submitCapture()">Add to the story</button>
      </div>
    </div>`;
  switchMode('voice');
}

function closeModal(){
  if (recognizer){ try{ recognizer.stop(); }catch(e){} }
  if (state._previewUrls){ state._previewUrls.forEach(u => URL.revokeObjectURL(u)); }
  state._previewUrls = [];
  modalRoot.innerHTML = '';
}

function switchMode(mode){
  // Stop any in-progress recording — otherwise the mic keeps listening
  // after the UI switches away and silently overwrites whatever the user
  // types in the new mode (and its callbacks reference DOM that's gone).
  if (recognizer){ try{ recognizer.stop(); }catch(e){} }
  ['Voice','Type','File'].forEach(m=>{
    document.getElementById(`mode${m}Btn`).classList.toggle('active', m.toLowerCase()===mode);
  });
  const body = document.getElementById('modeBody');
  if (mode === 'voice'){
    body.innerHTML = `
      <div class="voice-box">
        <button class="mic-btn" id="micBtn" onclick="toggleRecording()">🎤</button>
        <div class="voice-status" id="voiceStatus">Tap the mic and just talk</div>
        <div class="voice-transcript"><textarea class="capture-input" id="rawTextInput" placeholder="Your words will show up here — feel free to edit."></textarea></div>
      </div>`;
  } else if (mode === 'type'){
    body.innerHTML = `<textarea class="capture-input" id="rawTextInput" placeholder="Tell the story — as much or as little as you know. e.g. 'Cut timber off the north forty in 1986, sold to the Hendersons.'"></textarea>`;
  } else {
    body.innerHTML = `<textarea class="capture-input" id="rawTextInput" placeholder="Add a caption or a few words about the photo (optional) — attach the file below."></textarea>
      <div class="helper-note">Tip: even just "found this in the barn" is enough — you can fill in details later.</div>`;
  }
}

function toggleRecording(){
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec){
    document.getElementById('voiceStatus').textContent = "Voice input isn't supported in this browser — please type instead.";
    return;
  }
  const micBtn = document.getElementById('micBtn');
  if (recognizer){
    recognizer.stop();
    return;
  }
  recognizer = new SpeechRec();
  recognizer.continuous = true;
  recognizer.interimResults = true;
  recognizer.lang = 'en-US';
  let finalText = document.getElementById('rawTextInput').value || '';
  micBtn.classList.add('recording');
  document.getElementById('voiceStatus').textContent = 'Listening… tap again to stop';
  recognizer.onresult = (e) => {
    // The mode may have changed since recognition started — if the voice
    // textarea is gone, there's nothing to write into.
    const ta = document.getElementById('rawTextInput');
    if (!ta) return;
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++){
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript + ' ';
      else interim += e.results[i][0].transcript;
    }
    ta.value = (finalText + interim).trim();
  };
  recognizer.onerror = () => {
    const status = document.getElementById('voiceStatus');
    if (status) status.textContent = "Didn't catch that — tap the mic to try again.";
  };
  recognizer.onend = () => {
    const btn = document.getElementById('micBtn');
    const status = document.getElementById('voiceStatus');
    if (btn) btn.classList.remove('recording');
    if (status) status.textContent = 'Tap the mic and just talk';
    recognizer = null;
  };
  recognizer.start();
}

function handleFiles(fileList){
  state.pendingFiles = state.pendingFiles.concat(Array.from(fileList));
  renderFilePreview();
}
function removePendingFile(i){
  state.pendingFiles.splice(i,1);
  renderFilePreview();
}
function renderFilePreview(){
  // Drop any object URLs from the previous render before making new ones,
  // so repeatedly adding/removing files during one capture doesn't leak
  // memory for the life of the page.
  if (state._previewUrls){ state._previewUrls.forEach(u => URL.revokeObjectURL(u)); }
  state._previewUrls = [];
  const preview = document.getElementById('filePreview');
  preview.innerHTML = state.pendingFiles.map((f, i)=>{
    const isImg = f.type.startsWith('image/');
    let url = null;
    if (isImg){ url = URL.createObjectURL(f); state._previewUrls.push(url); }
    return `<div class="chip">${isImg ? `<img src="${url}">` : '📄'} ${escapeHtml(f.name.slice(0,18))} <button class="rm" onclick="removePendingFile(${i})">✕</button></div>`;
  }).join('');
}

async function submitCapture(){
  const rawText = (document.getElementById('rawTextInput').value || '').trim();
  if (!rawText && state.pendingFiles.length === 0){
    renderModalError("Add a few words or attach a photo/file first.");
    return;
  }
  const sheet = modalRoot.querySelector('.sheet');
  sheet.innerHTML = `<div class="loader"><div class="spinner"></div>Cleaning that up…</div>`;

  try{
    const cleaned = rawText
      ? await cleanupWithClaude(rawText)
      : { title: state.pendingFiles[0]?.name || 'A farm photo', dateLabel: 'Undated', sortYear: null, summary: 'A photo from the farm.' };
    showPreviewEdit(cleaned, rawText);
  }catch(e){
    sheet.innerHTML = `<div class="loader">Couldn't clean that up: ${escapeHtml(e.message)}<br><br>
      <button class="btn-secondary" onclick="closeModal()">Close</button></div>`;
  }
}

function renderModalError(msg){
  const sheet = modalRoot.querySelector('.sheet');
  const existing = sheet.querySelector('.error-box');
  if (existing) existing.remove();
  const box = document.createElement('div');
  box.className = 'error-box';
  box.textContent = msg;
  sheet.querySelector('.sheet-handle').after(box);
}

function showPreviewEdit(cleaned, rawText){
  const sheet = modalRoot.querySelector('.sheet');
  sheet.innerHTML = `
    <button class="close-x" onclick="closeModal()">✕</button>
    <div class="sheet-handle"></div>
    <h2>One more look</h2>
    <p class="sub">Here's the cleaned-up version — edit anything before it goes on the timeline.</p>
    <div class="field"><label>Title</label><input id="pvTitle" value="${escapeHtml(cleaned.title)}"></div>
    <div class="field"><label>Date</label><input id="pvDate" value="${escapeHtml(cleaned.dateLabel)}"></div>
    <div class="field"><label>Year (controls where it lands on the timeline — leave blank if unknown)</label><input id="pvYear" inputmode="numeric" placeholder="e.g. 1986" value="${cleaned.sortYear != null ? escapeHtml(String(cleaned.sortYear)) : ''}"></div>
    <div class="field"><label>Story</label><textarea id="pvSummary">${escapeHtml(cleaned.summary)}</textarea></div>
    <div class="helper-note" id="fileNote">${state.pendingFiles.length ? state.pendingFiles.length + ' file(s) will be saved to the shared Drive folder.' : ''}</div>
    <div class="btn-row">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="finalizeSave()">Save to the story</button>
    </div>`;
}

async function finalizeSave(){
  const sheet = modalRoot.querySelector('.sheet');
  const title = document.getElementById('pvTitle').value.trim() || 'A farm memory';
  const dateLabel = document.getElementById('pvDate').value.trim() || 'Undated';
  const yearRaw = document.getElementById('pvYear').value.trim();
  const sortYear = /^\d{1,4}$/.test(yearRaw) ? parseInt(yearRaw, 10) : null;
  const summary = document.getElementById('pvSummary').value.trim();
  sheet.innerHTML = `<div class="loader"><div class="spinner"></div>Saving to Drive…</div>`;

  try{
    const uploaded = [];
    for (const f of state.pendingFiles){
      const res = await uploadFileToDrive(f);
      uploaded.push(res);
    }
    const entry = {
      id: 'e_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      title, dateLabel, sortYear, summary,
      author: state.authorName,
      createdAt: Date.now(),
      files: uploaded.map(u => ({ id: u.id, name: u.name, webViewLink: u.webViewLink, thumbnailLink: u.thumbnailLink, mimeType: u.mimeType }))
    };
    state.entries.push(entry);
    await saveEntries();
    closeModal();
    renderTimeline();
  }catch(e){
    sheet.innerHTML = `<div class="loader">Couldn't save: ${escapeHtml(e.message)}<br><br>
      <button class="btn-secondary" onclick="closeModal()">Close</button></div>`;
  }
}

/* ============================================================
   9. EDIT / DELETE EXISTING ENTRIES
   ============================================================ */
function openEdit(id){
  const e = state.entries.find(x=>x.id===id);
  if (!e) return;
  modalRoot.innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="sheet">
        <button class="close-x" onclick="closeModal()">✕</button>
        <div class="sheet-handle"></div>
        <h2>Edit memory</h2>
        <div class="field"><label>Title</label><input id="edTitle" value="${escapeHtml(e.title)}"></div>
        <div class="field"><label>Date</label><input id="edDate" value="${escapeHtml(e.dateLabel)}"></div>
        <div class="field"><label>Year (controls where it lands on the timeline — leave blank if unknown)</label><input id="edYear" inputmode="numeric" placeholder="e.g. 1986" value="${e.sortYear != null ? escapeHtml(String(e.sortYear)) : ''}"></div>
        <div class="field"><label>Story</label><textarea id="edSummary">${escapeHtml(e.summary)}</textarea></div>
        <div class="btn-row">
          <button class="btn-secondary" onclick="closeModal()">Cancel</button>
          <button class="btn-primary" onclick="saveEdit('${id}')">Save changes</button>
        </div>
      </div>
    </div>`;
}

async function saveEdit(id){
  const e = state.entries.find(x=>x.id===id);
  if (!e) return;
  e.title = document.getElementById('edTitle').value.trim() || e.title;
  e.dateLabel = document.getElementById('edDate').value.trim() || e.dateLabel;
  const yearRaw = document.getElementById('edYear').value.trim();
  e.sortYear = /^\d{1,4}$/.test(yearRaw) ? parseInt(yearRaw, 10) : null;
  e.summary = document.getElementById('edSummary').value.trim();
  closeModal();
  renderLoading('Saving…');
  await saveEntries();
  renderTimeline();
}

async function deleteEntry(id){
  if (!confirm('Remove this from the timeline? (The uploaded file stays safe in Drive.)')) return;
  state.entries = state.entries.filter(x=>x.id!==id);
  renderLoading('Removing…');
  await saveEntries();
  renderTimeline();
}

/* ============================================================
   10. BOOT
   ============================================================ */
initGoogle();
</script>
