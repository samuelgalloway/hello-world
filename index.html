<title>Home Base</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light;
    --shell-w: 480px;
    --bg: #ece9e2;
    --surface: #f6f4ef;
    --surface-2: #faf8f3;
    --card: #ffffff;
    --ink: #1c1a16;
    --ink-secondary: #5a5648;
    --muted: #8d8878;
    --border: rgba(28,26,22,0.12);
    --border-strong: rgba(28,26,22,0.22);
    --accent: #4a3826;
    --accent-ink: #ffffff;
    --accent-soft: rgba(74,56,38,0.08);
    --shadow: 0 1px 2px rgba(28,26,22,0.06), 0 4px 16px rgba(28,26,22,0.06);

    --series-run: #2a78d6;
    --series-strength: #eb6834;
    --series-bjj: #1baf7a;

    --zone-under: #7a93b0;
    --zone-optimal: #0ca30c;
    --zone-caution: #fab219;
    --zone-high: #d03b3b;
    --zone-none: #c3c2b7;

    --phase-accumulation: #8b86b8;
    --phase-intensification: #6b5fa0;
    --phase-realization: #4a3826;
    --phase-deload: #a9bfa0;

    --chart-grid: #e1e0d9;
    --chart-axis: #c3c2b7;
    --success-text: #006300;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0c0b09;
      --surface: #17150f;
      --surface-2: #1c1a15;
      --card: #201e18;
      --ink: #f5f3ee;
      --ink-secondary: #c3c2b7;
      --muted: #928d80;
      --border: rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.18);
      --accent: #d9c6ac;
      --accent-ink: #201a12;
      --accent-soft: rgba(217,198,172,0.10);
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 24px rgba(0,0,0,0.4);
      --series-run: #3987e5; --series-strength: #d95926; --series-bjj: #199e70;
      --zone-under: #96aec7; --zone-optimal: #0ca30c; --zone-caution: #fab219; --zone-high: #e66767; --zone-none: #383835;
      --phase-accumulation: #9c97cc; --phase-intensification: #8478c9; --phase-realization: #d9c6ac; --phase-deload: #93ab89;
      --chart-grid: #2c2c2a; --chart-axis: #383835; --success-text: #0ca30c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0c0b09; --surface: #17150f; --surface-2: #1c1a15; --card: #201e18;
    --ink: #f5f3ee; --ink-secondary: #c3c2b7; --muted: #928d80;
    --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.18);
    --accent: #d9c6ac; --accent-ink: #201a12; --accent-soft: rgba(217,198,172,0.10);
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 24px rgba(0,0,0,0.4);
    --series-run: #3987e5; --series-strength: #d95926; --series-bjj: #199e70;
    --zone-under: #96aec7; --zone-optimal: #0ca30c; --zone-caution: #fab219; --zone-high: #e66767; --zone-none: #383835;
    --phase-accumulation: #9c97cc; --phase-intensification: #8478c9; --phase-realization: #d9c6ac; --phase-deload: #93ab89;
    --chart-grid: #2c2c2a; --chart-axis: #383835; --success-text: #0ca30c;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif; font-size: 14.5px; line-height: 1.45; }
  h1, h2, h3, .display { font-family: "Barlow Condensed", system-ui, sans-serif; font-weight: 700; letter-spacing: 0.01em; color: var(--ink); }
  .mono, .num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-appearance: none; }
  a { color: inherit; }
  ::selection { background: var(--accent-soft); }

  .app-shell { max-width: var(--shell-w); margin: 0 auto; min-height: 100vh; background: var(--surface); position: relative; box-shadow: var(--shadow); }
  .app-main { padding: 4px 16px 96px; }
  .tab-screen[hidden] { display: none; }

  /* ---------- top bar ---------- */
  .topbar2 { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  .topbar2 .brand { display: flex; align-items: center; gap: 8px; }
  .topbar2 .mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; font-family: "Barlow Condensed"; font-weight: 700; font-size: 14px; }
  .topbar2 h1 { font-size: 19px; margin: 0; }
  .icon-btn2 { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border-strong); background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .icon-btn2:active { background: var(--surface-2); }

  /* ---------- bottom nav ---------- */
  .bottom-nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: var(--shell-w); display: flex; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--border); z-index: 30; padding-bottom: env(safe-area-inset-bottom, 0); }
  .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 4px 8px; border: none; background: transparent; color: var(--muted); font-size: 11px; font-weight: 600; }
  .nav-btn .ic { font-size: 19px; line-height: 1; }
  .nav-btn[aria-current="true"] { color: var(--accent); }

  /* ---------- fab ---------- */
  .fab { position: fixed; bottom: 84px; right: max(16px, calc(50% - var(--shell-w) / 2 + 16px)); width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); border: none; font-size: 24px; box-shadow: 0 6px 18px rgba(0,0,0,.25); z-index: 25; display: flex; align-items: center; justify-content: center; }
  .fab[hidden] { display: none; }
  /* Reserve a gutter on the Train screen so no card control ever sits under the fixed FAB. */
  #tab-train > * { margin-right: 58px; }

  /* ---------- cards / generic ---------- */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden; }
  .card-pad { padding: 14px 15px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .card-head h2 { font-size: 16.5px; margin: 0; }
  .card-head .link-btn { font-size: 12px; color: var(--accent); font-weight: 600; background: none; border: none; }
  .section-title { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 18px 0 8px 2px; }
  .section-title:first-child { margin-top: 2px; }

  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 3px; border-radius: 100px; font-size: 11.5px; font-weight: 600; }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; }
  .pill-optimal { background: color-mix(in srgb, var(--zone-optimal) 16%, transparent); color: var(--success-text); }
  .pill-optimal .dot { background: var(--zone-optimal); }
  .pill-caution { background: color-mix(in srgb, var(--zone-caution) 22%, transparent); color: #7a5300; }
  :root[data-theme="dark"] .pill-caution, :root:not([data-theme="light"]) .pill-caution { color: #ffd27a; }
  .pill-caution .dot { background: var(--zone-caution); }
  .pill-high { background: color-mix(in srgb, var(--zone-high) 16%, transparent); color: var(--zone-high); }
  .pill-high .dot { background: var(--zone-high); }
  .pill-under { background: color-mix(in srgb, var(--zone-under) 20%, transparent); color: var(--zone-under); }
  .pill-under .dot { background: var(--zone-under); }
  .pill-none { background: var(--surface-2); color: var(--muted); }
  .pill-none .dot { background: var(--zone-none); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: 9px; border: 1px solid var(--border-strong); background: var(--card); font-size: 13.5px; font-weight: 500; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn-ghost { background: transparent; border-color: transparent; }
  .btn-block { width: 100%; }
  .btn-sm { padding: 6px 10px; font-size: 12.5px; border-radius: 7px; }
  .btn:disabled { opacity: .45; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--series-run); outline-offset: 2px; }

  .field { margin-bottom: 11px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-secondary); margin-bottom: 4px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .field-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 9px; }
  input[type=text], input[type=number], input[type=date], input[type=file], select, textarea {
    width: 100%; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--border-strong); background: var(--surface); font-size: 15px;
  }
  textarea { resize: vertical; min-height: 60px; }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .banner { display: flex; gap: 8px; padding: 9px 11px; border-radius: 9px; background: var(--accent-soft); border: 1px solid var(--border); font-size: 12.5px; margin-bottom: 11px; }
  .banner.warn { background: color-mix(in srgb, var(--zone-caution) 14%, transparent); }
  .banner.err { background: color-mix(in srgb, var(--zone-high) 12%, transparent); }
  .empty-note { color: var(--muted); font-size: 13px; padding: 14px 0; text-align: center; }

  /* ---------- Today: weather ---------- */
  .wx-strip { display: flex; gap: 4px; overflow-x: auto; padding: 2px 0 6px; }
  .wx-day { flex: 1; min-width: 46px; text-align: center; padding: 6px 2px; border-radius: 9px; }
  .wx-day .d { font-size: 10.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
  .wx-day .ic { font-size: 18px; margin: 3px 0; }
  .wx-day .hi { font-size: 13px; font-weight: 600; font-family: "IBM Plex Mono"; }
  .wx-day .rn { font-size: 10.5px; color: var(--series-run); font-family: "IBM Plex Mono"; }
  .wx-verdict { font-size: 13.5px; font-weight: 500; margin-top: 4px; padding-top: 10px; border-top: 1px solid var(--border); }
  .loc-row { display: flex; gap: 6px; }
  .loc-results { margin-top: 6px; }
  .loc-result { padding: 8px 9px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }

  /* ---------- Today: house preview + full list ---------- */
  .task-row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .task-row:last-child { border-bottom: none; }
  .task-check { width: 21px; height: 21px; border-radius: 7px; border: 1.5px solid var(--border-strong); background: var(--card); flex: none; margin-top: 1px; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .task-check.done { background: var(--zone-optimal); border-color: var(--zone-optimal); color: #fff; }
  .task-meta { flex: 1; min-width: 0; }
  .task-name { font-size: 13.8px; }
  .task-due { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .task-due.overdue { color: var(--zone-high); font-weight: 600; }
  .add-row { display: flex; gap: 6px; margin-top: 4px; }

  /* ---------- Train ---------- */
  .stat-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .tile2 { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 13px; }
  .tile2 .label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .tile2 .value { font-family: "Barlow Condensed"; font-size: 28px; font-weight: 700; line-height: 1.1; margin-top: 3px; }
  .tile2 .sub { font-size: 12px; color: var(--ink-secondary); margin-top: 3px; }

  .seg { display: flex; gap: 2px; background: var(--surface-2); border-radius: 9px; padding: 3px; margin-bottom: 8px; }
  .seg button { flex: 1; padding: 6px 4px; border-radius: 6px; border: none; background: transparent; font-size: 11.5px; font-weight: 600; color: var(--ink-secondary); }
  .seg button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  .heat-scroll { overflow-x: auto; padding-bottom: 4px; }
  .phase-band { display: grid; grid-auto-flow: column; grid-auto-columns: 13px; gap: 2px; margin-bottom: 4px; height: 13px; }
  .phase-cell { border-radius: 3px; }
  .heat-grid { display: grid; grid-auto-flow: column; grid-auto-columns: 13px; grid-template-rows: repeat(7, 13px); gap: 2px; }
  .heat-cell { border-radius: 3px; background: var(--zone-none); opacity: .35; }
  .heat-cell.has-data { opacity: 1; }
  .heat-row-wrap { display: flex; }
  .heat-daynames { display: grid; grid-template-rows: repeat(7,13px); gap: 2px; font-size: 8px; color: var(--muted); margin-right: 5px; }
  .heat-legend { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 8px; font-size: 10.5px; color: var(--ink-secondary); }
  .heat-legend .item { display: flex; align-items: center; gap: 4px; }
  .heat-legend .sw { width: 9px; height: 9px; border-radius: 3px; }

  .sess-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .sess-row:last-child { border-bottom: none; }
  .sess-row .sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .sess-row .d { color: var(--muted); font-size: 11.5px; width: 44px; flex: none; }
  .sess-row .info { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess-row .ld { color: var(--ink-secondary); font-size: 12px; flex: none; }

  /* ---------- ask claude ---------- */
  .today-acwr-num { font-family: "Barlow Condensed"; font-size: 26px; font-weight: 700; }
  .ask-box textarea { min-height: 46px; }
  .ask-answer { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 13.5px; white-space: pre-wrap; }

  /* ---------- sheets ---------- */
  .backdrop { position: fixed; inset: 0; background: rgba(10,9,7,.45); z-index: 40; }
  .backdrop[hidden] { display: none; }
  .sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: var(--shell-w); max-height: 88vh; overflow-y: auto; background: var(--surface); border-radius: 18px 18px 0 0; z-index: 41; padding: 6px 16px 24px; box-shadow: 0 -8px 30px rgba(0,0,0,.2); }
  .sheet[hidden] { display: none; }
  .sheet-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border-strong); margin: 10px auto 12px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .sheet-head h2 { font-size: 18px; margin: 0; }

  .tabs2 { display: flex; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: 10px; margin-bottom: 12px; }
  .tab-btn2 { flex: 1; padding: 7px 4px; border-radius: 7px; border: none; background: transparent; font-size: 11.5px; font-weight: 600; color: var(--ink-secondary); }
  .tab-btn2[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .tab-panel2[hidden] { display: none; }

  .exercise-row { display: grid; grid-template-columns: 1.5fr .6fr .6fr .8fr auto; gap: 6px; margin-bottom: 6px; align-items: center; }
  .exercise-row input { padding: 7px 7px; font-size: 13px; }
  .tonnage-readout { font-size: 12.5px; color: var(--ink-secondary); margin: 6px 0 2px; }

  .block-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .block-item:last-child { border-bottom: none; }
  .block-chip { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .block-item .meta { flex: 1; min-width: 0; }
  .block-item .name { font-weight: 600; font-size: 13px; }
  .block-item .dates { font-size: 11.5px; color: var(--muted); }
  .icon-btn3 { border: none; background: transparent; color: var(--muted); padding: 4px 6px; border-radius: 5px; font-size: 15px; }

  #tooltip { position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 11.5px; padding: 7px 9px; border-radius: 7px; max-width: 200px; line-height: 1.4; box-shadow: 0 6px 18px rgba(0,0,0,.25); opacity: 0; transition: opacity .08s ease; }
  #tooltip.show { opacity: 1; }
  .chart-svg text { fill: var(--muted); font-size: 9px; font-family: "IBM Plex Mono", monospace; }
  .chart-svg .axis-line { stroke: var(--chart-axis); stroke-width: 1; }
  .chart-svg .grid-line { stroke: var(--chart-grid); stroke-width: 1; stroke-dasharray: 2 3; }

  .modality-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--ink-secondary); margin-top: 8px; }
  .modality-legend .item { display: flex; align-items: center; gap: 5px; }
  .modality-legend .sw { width: 9px; height: 9px; border-radius: 3px; }
</style>

<div id="tooltip" role="tooltip"></div>

<div class="app-shell">
  <div class="topbar2">
    <div class="brand"><span class="mark">HB</span><h1>Home Base</h1></div>
    <button class="icon-btn2" id="btn-open-settings" type="button" aria-label="Settings">⚙</button>
  </div>

  <div class="app-main">
    <!-- ===================== TODAY ===================== -->
    <section class="tab-screen" id="tab-today">
      <div class="section-title">Weather</div>
      <div class="card card-pad" id="weather-card"></div>

      <div class="section-title">House</div>
      <div class="card card-pad">
        <div class="card-head"><h2>Up next</h2><button class="link-btn" data-goto="house" type="button">See all →</button></div>
        <div id="today-house-list"></div>
      </div>

      <div class="section-title">Training</div>
      <div class="card card-pad" id="today-training" data-goto="train"></div>

      <div class="section-title">Ask</div>
      <div class="card card-pad ask-box" id="ask-card"></div>
    </section>

    <!-- ===================== TRAIN ===================== -->
    <section class="tab-screen" id="tab-train" hidden>
      <div id="sample-banner" class="banner" style="display:none;">
        <span>&#9873;</span>
        <span>Example data so this isn't empty. Log a real session and it clears itself.
        <button class="btn btn-sm btn-ghost" id="btn-clear-sample" type="button" style="text-decoration:underline; padding:2px 4px;">Clear</button></span>
      </div>

      <div class="stat-row2" id="train-stats"></div>

      <div class="card card-pad">
        <div class="seg" id="train-seg" role="tablist"></div>
        <div id="train-chart"></div>
        <div class="modality-legend" id="train-legend"></div>
      </div>

      <div class="card card-pad">
        <div class="card-head"><h2>Recovery heat map</h2></div>
        <div class="heat-scroll" id="heatmap-wrap"></div>
      </div>

      <div class="card card-pad">
        <div class="card-head"><h2>Recent sessions</h2><button class="link-btn" id="btn-toggle-sessions" type="button">Show all</button></div>
        <div id="session-list"></div>
      </div>

      <button class="btn btn-block btn-ghost" id="btn-manage-blocks" type="button" style="border:1px solid var(--border-strong); margin-bottom: 12px;">Manage periodization blocks →</button>
    </section>

    <!-- ===================== HOUSE ===================== -->
    <section class="tab-screen" id="tab-house" hidden>
      <div class="card card-pad">
        <div class="card-head"><h2>House Management</h2></div>
        <div class="add-row">
          <input type="text" id="house-new-task" placeholder="Add a task…" />
          <button class="btn btn-primary btn-sm" id="btn-add-house-task" type="button">Add</button>
        </div>
      </div>
      <div class="card card-pad" id="house-full-list"></div>
    </section>
  </div>

  <div class="bottom-nav" role="tablist">
    <button class="nav-btn" data-nav="today" aria-current="true" type="button"><span class="ic">◐</span>Today</button>
    <button class="nav-btn" data-nav="train" aria-current="false" type="button"><span class="ic">◆</span>Train</button>
    <button class="nav-btn" data-nav="house" aria-current="false" type="button"><span class="ic">⌂</span>House</button>
  </div>

  <button class="fab" id="fab-log" type="button" aria-label="Log a session" hidden>+</button>

  <!-- ===================== SHEET: log session ===================== -->
  <div class="backdrop" id="backdrop-log" hidden></div>
  <div class="sheet" id="sheet-log" hidden>
    <div class="sheet-handle"></div>
    <div class="sheet-head"><h2>Log a session</h2><button class="icon-btn2" data-close="sheet-log" type="button">✕</button></div>
    <div class="tabs2" role="tablist" id="tabs">
      <button class="tab-btn2" role="tab" data-tab="manual" aria-selected="true" type="button">Manual</button>
      <button class="tab-btn2" role="tab" data-tab="csv" aria-selected="false" type="button">Garmin CSV</button>
      <button class="tab-btn2" role="tab" data-tab="photo" aria-selected="false" type="button">Photo</button>
      <button class="tab-btn2" role="tab" data-tab="describe" aria-selected="false" type="button">Describe</button>
    </div>

  function parseCSV(text) {
    var rows = [], row = [], field = "", inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQuotes) { if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; } else field += c; }
      else { if (c === '"') inQuotes = true; else if (c === ",") { row.push(field); field = ""; } else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(field); field = ""; rows.push(row); row = []; } else field += c; }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter(function (r) { return r.length > 1 || (r[0] && r[0].trim()); });
  }
  function guessModality(t) { t = (t || "").toLowerCase(); if (/run/.test(t)) return "run"; if (/cycl|bik/.test(t)) return "bike"; if (/strength|weight/.test(t)) return "strength"; if (/martial|mma|jiu|combat|wrestl/.test(t)) return "bjj"; return "other"; }
  function parseDuration(str) { if (!str) return null; var parts = String(str).split(":").map(Number); if (parts.some(isNaN)) return null; if (parts.length === 3) return round1(parts[0] * 60 + parts[1] + parts[2] / 60); if (parts.length === 2) return round1(parts[0] + parts[1] / 60); return Number(str) || null; }
  function numOnly(str) { if (!str) return null; var n = parseFloat(String(str).replace(/[^0-9.\-]/g, "")); return isNaN(n) ? null : n; }
  function simpleHash(str) { var h = 0; for (var i = 0; i < str.length; i++) { h = (h << 5) - h + str.charCodeAt(i); h |= 0; } return Math.abs(h).toString(36); }

  var csvParsed = [];

    document.getElementById("csv-file").addEventListener("change", function (ev) {
      var file = ev.target.files[0]; if (!file) return;

          return { date: date, activityType: type, title: iTitle >= 0 ? r[iTitle] : "", modality: guessModality(type), durationMin: iDur >= 0 ? parseDuration(r[iDur]) : null, distanceKm: iDist >= 0 ? numOnly(r[iDist]) : null, avgHr: iHr >= 0 ? numOnly(r[iHr]) : null };
        }).filter(function (r) { return r.durationMin || r.distanceKm; });
        var prev = document.getElementById("csv-preview");

        prev.innerHTML = '<div class="hint" style="margin:8px 0;">Found ' + csvParsed.length + ' activities.</div><div style="max-height:180px; overflow-y:auto; border:1px solid var(--border); border-radius:8px;"><table style="width:100%; font-size:12px; border-collapse:collapse;"><tbody>' +

          '</tbody></table></div><button class="btn btn-primary btn-block" id="btn-import-csv" type="button" style="margin-top:10px;">Import ' + csvParsed.length + ' sessions</button>';
        prev.querySelectorAll(".csv-mod-sel").forEach(function (sel) { sel.addEventListener("change", function () { csvParsed[Number(sel.getAttribute("data-idx"))].modality = sel.value; }); });
        document.getElementById("btn-import-csv").addEventListener("click", function () {
          csvParsed.forEach(function (r) { var id = "garmin-" + simpleHash(r.date + "|" + r.activityType + "|" + r.durationMin + "|" + r.distanceKm); saveSession({ id: id, date: r.date, modality: r.modality, durationMin: r.durationMin, distanceKm: r.distanceKm, avgHr: r.avgHr, notes: r.title || "", source: "garmin" }); });
          prev.innerHTML = '<div class="banner">Imported. Re-importing the same file updates rows instead of duplicating.</div>';
        });
      };
      reader.readAsText(file);
    });
  }

  function mcpErrCopy(e) {
    var code = e && e.code, server = (e && e.server) || "this connector";
    if (code === "needs_reauth") return "Reconnect " + server + " in claude.ai Settings → Connectors.";
    if (code === "server_not_connected") return "Add " + server + " in claude.ai Settings → Connectors.";
    if (code === "selection_required") return "Choose a " + server + " account in the prompt, then reload.";
    if (code === "blocked_by_policy" || code === "approval_required") return server + " access is restricted for this account.";
    if (code === "server_unavailable" || code === "upstream_error") return server + " isn't responding right now.";
    if (code === "tool_error") return e.message || (server + " reported an error.");
    if (code === "not_granted" || code === "capability_disabled" || code === "capability_removed") return null; // hide entirely
    return "Couldn't reach " + server + " right now.";

    if (!CAP.mcp) { renderHouseSections(null, { code: "not_granted" }); return; }
    if (houseUnsub) houseUnsub();
    houseUnsub = CAP.mcp.watchTool(CLICKUP_SERVER, "clickup_filter_tasks", { list_ids: [state.profile.clickupListId], include_closed: false }, function (ev) {
      if (ev.type === "data") { lastTasks = (ev.result.payload && ev.result.payload.tasks) || []; lastTasksErr = null; }
      else { lastTasksErr = ev.error; if (["needs_reauth", "server_not_connected", "blocked_by_policy", "approval_required"].indexOf(ev.error.code) >= 0) lastTasks = null; }
      renderHouseSections(lastTasks, lastTasksErr);
    }, { refetchInterval: 120000 });
  }
  function taskDueInfo(t) {
    if (!t.due_date) return { text: "No due date", overdue: false };
    var ms = Number(t.due_date); if (isNaN(ms)) return { text: "", overdue: false };
    var iso = new Date(ms).toISOString().slice(0, 10);
    var overdue = iso < todayISO();
    return { text: (overdue ? "Overdue · " : "Due ") + fmtDate(iso), overdue: overdue };
  }
  function toggleTask(t) {
    if (!CAP.mcp) return;
    var newStatus = t.status === "complete" ? "to do" : "complete";
    CAP.mcp.callTool(CLICKUP_SERVER, "clickup_update_task", { task_id: t.id, status: newStatus }).then(function () {
      CAP.mcp.invalidate(CLICKUP_SERVER, "clickup_filter_tasks");
    }).catch(function (e) { alert(mcpErrCopy(e) || "Couldn't update that task."); });
  }
  function addHouseTask(name) {
    if (!CAP.mcp || !name.trim()) return;
    CAP.mcp.callTool(CLICKUP_SERVER, "clickup_create_task", { name: name.trim(), list_id: state.profile.clickupListId }).then(function () {
      CAP.mcp.invalidate(CLICKUP_SERVER, "clickup_filter_tasks");
    }).catch(function (e) { alert(mcpErrCopy(e) || "Couldn't add that task."); });
  }
  function taskRowHtml(t) {
    var due = taskDueInfo(t), done = t.status === "complete";
    return '<div class="task-row"><button class="task-check' + (done ? " done" : "") + '" data-taskid="' + t.id + '" type="button">' + (done ? "✓" : "") + '</button><div class="task-meta"><div class="task-name">' + t.name + '</div><div class="task-due' + (due.overdue ? " overdue" : "") + '">' + due.text + '</div></div></div>';
  }
  function renderHouseSections(tasks, err) {
    var todayEl = document.getElementById("today-house-list"), fullEl = document.getElementById("house-full-list");
    if (err) {
      var copy = mcpErrCopy(err);
      var html = copy ? '<div class="banner err">' + copy + '</div>' : '<div class="empty-note">House tasks aren’t connected in this view.</div>';
      todayEl.innerHTML = html; fullEl.innerHTML = html; return;
    }
    if (!tasks) { todayEl.innerHTML = '<div class="empty-note">Loading…</div>'; fullEl.innerHTML = '<div class="empty-note">Loading…</div>'; return; }
    var sorted = tasks.slice().sort(function (a, b) { var da = a.due_date ? Number(a.due_date) : Infinity, db = b.due_date ? Number(b.due_date) : Infinity; return da - db; });
    if (!sorted.length) { todayEl.innerHTML = '<div class="empty-note">Nothing on the list.</div>'; fullEl.innerHTML = '<div class="empty-note">Nothing on the list. Add one above.</div>'; }
    else {
      todayEl.innerHTML = sorted.slice(0, 4).map(taskRowHtml).join("");
      fullEl.innerHTML = sorted.map(taskRowHtml).join("");
    }
    [todayEl, fullEl].forEach(function (el) { el.querySelectorAll("[data-taskid]").forEach(function (btn) { btn.addEventListener("click", function () { var t = tasks.find(function (x) { return x.id === btn.getAttribute("data-taskid"); }); if (t) toggleTask(t); }); }); });
  }
  document.getElementById("btn-add-house-task").addEventListener("click", function () {
    var input = document.getElementById("house-new-task"); addHouseTask(input.value); input.value = "";
  });
  document.getElementById("house-new-task").addEventListener("keydown", function (ev) { if (ev.key === "Enter") document.getElementById("btn-add-house-task").click(); });

  /* ===================== mcp: weather ===================== */
  var weatherUnsub = null, lastWeather = null, lastWeatherErr = null;
  function onWeatherLocationMaybeReady() {
    if (!CAP.mcp || !state.profile.weatherLocationKey) { renderWeatherCard(null, null); return; }
    if (prevWeatherKey === state.profile.weatherLocationKey && weatherUnsub) return;
    prevWeatherKey = state.profile.weatherLocationKey;
    if (weatherUnsub) weatherUnsub();
    weatherUnsub = CAP.mcp.watchTool(WEATHER_SERVER, "widgets-daily-claude", { locationKey: state.profile.weatherLocationKey, unit: "imperial" }, function (ev) {
      if (ev.type === "data") { lastWeather = ev.result.payload; lastWeatherErr = null; }
      else { lastWeatherErr = ev.error; if (["needs_reauth", "server_not_connected", "blocked_by_policy", "approval_required"].indexOf(ev.error.code) >= 0) lastWeather = null; }
      renderWeatherCard(lastWeather, lastWeatherErr);
    }, { refetchInterval: 3600000 });
  }
  function wxEmoji(day) { var p = day.rainProbabilityValue || 0; if (p >= 55) return "🌧️"; if (p >= 25) return "🌥️"; return "☀️"; }
  function renderWeatherCard(payload, err) {
    var el = document.getElementById("weather-card");
    if (!CAP.mcp) { el.innerHTML = '<div class="empty-note">Weather isn’t connected in this view.</div>'; return; }
    if (!state.profile.weatherLocationKey) {
      el.innerHTML = '<div class="banner">Set your location to see this week’s rain outlook.</div><button class="btn btn-block" id="wx-set-loc" type="button">Set location in Settings</button>';
      document.getElementById("wx-set-loc").addEventListener("click", function () { openSheet("sheet-settings"); });
      return;
    }
    if (err) { var copy = mcpErrCopy(err); el.innerHTML = copy ? '<div class="banner err">' + copy + '</div>' : '<div class="empty-note">Weather isn’t available in this view.</div>'; return; }
    if (!payload) { el.innerHTML = '<div class="empty-note">Loading forecast…</div>'; return; }
    var days = (payload.dailyForecast || []).slice(0, 7);
    var totalRain = 0, maxRainChance = 0;
    var strip = days.map(function (d, i) {
      var rain = (d.day.extended && d.day.extended.rainValue || 0) + (d.night.extended && d.night.extended.rainValue || 0);
      totalRain += rain; maxRainChance = Math.max(maxRainChance, d.day.rainProbabilityValue || 0);
      return '<div class="wx-day"><div class="d">' + (i === 0 ? "Today" : d.shortDayOfWeek) + '</div><div class="ic">' + wxEmoji(d.day) + '</div><div class="hi">' + Math.round(d.day.temperature) + '°</div><div class="rn">' + (d.day.rainProbabilityValue || 0) + '%</div></div>';
    }).join("");
    var verdict = totalRain >= 0.5 || maxRainChance >= 60 ? "Rain expected — probably skip watering this week." : totalRain >= 0.1 ? "A little rain expected — check before watering." : "Dry week ahead — the yard will need watering.";
    el.innerHTML = '<div class="wx-strip">' + strip + '</div><div class="wx-verdict">' + verdict + ' <span class="hint">(' + (payload.location ? payload.location.localizedName : state.profile.weatherLocationName) + ')</span></div>';
  }

  /* ===================== Ask Claude (Today) ===================== */
  function renderAskCard() {
    var el = document.getElementById("ask-card");
    if (!CAP.sample) { el.innerHTML = '<div class="empty-note">Ask Claude isn’t available in this view.</div>'; return; }
    el.innerHTML = '<div class="field"><textarea id="ask-input" placeholder="e.g. quick dinner idea with chicken and broccoli"></textarea></div><button class="btn btn-primary btn-block" id="btn-ask" type="button">Ask</button><div id="ask-answer" class="ask-answer" style="display:none;"></div>';
    document.getElementById("btn-ask").addEventListener("click", function () {
      var q = document.getElementById("ask-input").value.trim(); if (!q) return;
      var out = document.getElementById("ask-answer"); out.style.display = "block"; out.textContent = "Thinking…";
      var prompt = "You're a quick-answer box on someone's personal home dashboard. Dietary guideline to respect for any food question: " + (state.profile.dietaryNotes || "none set") + ". Be brief and conversational.\n\nQuestion: " + q;
      CAP.sample(prompt, { modelTier: "quick", onText: function (u) { out.textContent = u.text; } }).catch(function (e) { out.textContent = sampleErrCopy(e); });
    });
  }

  /* ===================== Today: training snapshot ===================== */
  function renderTodayTraining(overall, todayBlock) {
    var el = document.getElementById("today-training");
    var lastR = overall.ratio[overall.ratio.length - 1], zone = acwrZone(lastR);
    var thisWeekStart = addDays(todayISO(), -6);
    var count = state.sessions.filter(function (s) { return s.date >= thisWeekStart && s.date <= todayISO(); }).length;
    el.innerHTML = '<div style="display:flex; align-items:center; justify-content:space-between;"><div><div class="today-acwr-num">' + (lastR === null ? "–" : lastR.toFixed(2)) + ' ACWR</div><div class="sub" style="font-size:12.5px; color:var(--ink-secondary); margin-top:2px;">' + count + ' session' + (count === 1 ? "" : "s") + ' this week' + (todayBlock ? " · " + todayBlock.phase : "") + '</div></div><span class="pill pill-' + zone + '"><span class="dot"></span>' + ZONE_LABEL[zone] + '</span></div>';
  }
  document.getElementById("today-training").addEventListener("click", function () { switchMainTab("train"); });

  /* ===================== nav / sheets ===================== */
  function switchMainTab(name) {
    ["today", "train", "house"].forEach(function (t) { document.getElementById("tab-" + t).hidden = t !== name; });
    document.querySelectorAll(".nav-btn").forEach(function (b) { b.setAttribute("aria-current", b.getAttribute("data-nav") === name ? "true" : "false"); });
    document.getElementById("fab-log").hidden = name !== "train";
  }
  document.querySelectorAll(".nav-btn").forEach(function (b) { b.addEventListener("click", function () { switchMainTab(b.getAttribute("data-nav")); }); });
  document.querySelectorAll("[data-goto]").forEach(function (el) { if (el.tagName === "BUTTON" && el.hasAttribute("data-goto")) el.addEventListener("click", function () { switchMainTab(el.getAttribute("data-goto")); }); });

  function openSheet(id) { document.getElementById(id).hidden = false; document.getElementById("backdrop-" + id.replace("sheet-", "")).hidden = false; }
  function closeSheet(id) { document.getElementById(id).hidden = true; document.getElementById("backdrop-" + id.replace("sheet-", "")).hidden = true; }
  document.querySelectorAll("[data-close]").forEach(function (b) { b.addEventListener("click", function () { closeSheet(b.getAttribute("data-close")); }); });
  document.getElementById("backdrop-log").addEventListener("click", function () { closeSheet("sheet-log"); });
  document.getElementById("backdrop-blocks").addEventListener("click", function () { closeSheet("sheet-blocks"); });
  document.getElementById("backdrop-settings").addEventListener("click", function () { closeSheet("sheet-settings"); });
  document.getElementById("fab-log").addEventListener("click", function () { openSheet("sheet-log"); });
  document.getElementById("btn-manage-blocks").addEventListener("click", function () { openSheet("sheet-blocks"); });
  document.getElementById("btn-open-settings").addEventListener("click", function () { openSheet("sheet-settings"); });
  document.getElementById("btn-clear-sample").addEventListener("click", function () { clearSampleIfNeeded(); lsSet(LS_KEYS.sessions, []); lsSet(LS_KEYS.blocks, []); renderAll(); });

  /* ===================== master render ===================== */
  var manualPanelSeeded = false;
  function renderAll() {
    if (!state.ready) return;
    document.getElementById("sample-banner").style.display = state.isSample ? "flex" : "none";

    var axis = buildDateAxis(state.sessions);
    var dates = []; var cur = axis.start; while (cur <= axis.end) { dates.push(cur); cur = addDays(cur, 1); }
    var dailyMaps = dailyLoadMaps(state.sessions, state.profile);
    var perMod = {}; TRACKED_MODALITIES.forEach(function (m) { perMod[m] = rollingSeries(dailyMaps[m], dates); });
    var overall = overallComposite(perMod, dates);
    var overallByDate = {}; dates.forEach(function (d, i) { overallByDate[d] = overall.ratio[i]; });
    lastPerMod = perMod; lastOverall = overall; lastDates = dates;

    var todayBlock = blockForDate(todayISO());
    renderTrainStats(overall, todayBlock);
    renderTrainSeg(perMod);
    renderTrainChartSection(perMod);
    renderHeatmap(overallByDate);
    renderSessionList();
    renderBlocks();
    renderTodayTraining(overall, todayBlock);

    if (!manualPanelSeeded) { renderManualPanel(null); manualPanelSeeded = true; }
  }

  /* ===================== boot ===================== */
  renderCsvPanel(); renderPhotoPanel(); renderDescribePanel(); renderAskCard();
  renderWeatherCard(null, null); renderHouseSections(null, null); renderSettings();

  (window.claude && window.claude.use ? window.claude.use("sample") : Promise.resolve(null)).then(function (s) {
    CAP.sample = s;
    if (s) { s.limits().then(function (l) { CAP.imagesOk = !!l.images; renderPhotoPanel(); }).catch(function () { renderPhotoPanel(); }); }
    renderDescribePanel(); renderAskCard();
  });
  (window.claude && window.claude.use ? window.claude.use("downloads") : Promise.resolve(null)).then(function (d) { CAP.downloads = d; });
  (window.claude && window.claude.use ? window.claude.use("mcp") : Promise.resolve(null)).then(function (m) {
    CAP.mcp = m;
    initHouseWatch();
    onWeatherLocationMaybeReady();
  });

  initStore();
})();
</script>
