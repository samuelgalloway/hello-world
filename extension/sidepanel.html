<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Voice Browser</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <h1>Voice Browser</h1>
      <button id="settingsBtn" title="Settings" aria-label="Settings">&#9881;</button>
    </header>

    <main>
      <div class="controls">
        <button id="micBtn" class="mic-btn" aria-pressed="false">
          <span class="mic-icon" aria-hidden="true">&#127908;</span>
          <span id="micLabel">Start listening</span>
        </button>
        <button id="recordBtn" class="record-btn" aria-pressed="false" title="Record a macro from what you say next">
          <span aria-hidden="true">&#9210;</span>
          <span id="recordLabel">Record macro</span>
        </button>
      </div>

      <p id="transcript" class="transcript" aria-live="polite"></p>
      <p id="statusLine" class="status-line"></p>

      <ul id="log" class="log" aria-live="polite"></ul>
    </main>

    <script src="sidepanel.js"></script>
  </body>
</html>
